# PostgreSQL for local development.
#
# Docker rather than a local install so the version is pinned, the state is
# disposable, and a reviewer can run this without installing anything.

services:
  postgres:
    # Pinned to a minor version. `postgres:latest` would mean the database
    # silently changes under the tool between runs, which is the opposite of
    # what a reproducible environment is for.
    image: postgres:16.4
    container_name: flightlog-postgres
    environment:
      POSTGRES_USER: flightlog
      POSTGRES_PASSWORD: flightlog
      POSTGRES_DB: flightlog
    ports:
      # Host 5434, container 5432. Deliberately not the default: a local
      # Postgres install or another project's container is very often already
      # on 5432, and the resulting failure — connecting successfully to the
      # wrong database — is considerably worse than a refused connection.
      - "5434:5432"
    volumes:
      # Named volume, so data survives `docker compose down` but is removable
      # with `docker compose down -v` when a clean slate is wanted.
      - flightlog-pgdata:/var/lib/postgresql/data
      # Everything in this directory runs once, in filename order, the first
      # time the container initialises an empty data directory. It does NOT
      # run again on subsequent starts — a schema change means recreating the
      # volume, which is noted in the README.
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # pg_isready returns non-zero until the server accepts connections.
      # Without this, the container reports "started" while Postgres is still
      # initialising, and the first connection attempt fails for reasons that
      # look like a configuration problem.
      test: ["CMD-SHELL", "pg_isready -U flightlog -d flightlog"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  flightlog-pgdata:
